<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4/16 加入 SiLU 激活</title><style>:root{--font-size-base:16px;--muted-foreground:#536274;--foreground:#162b40;--border:#d7e0e8;--background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px;color:var(--foreground);background:white;font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}h1,h2,h3{line-height:1.35}h2,h3{font-weight:600}.btn{font:inherit;max-width:100%;white-space:normal;overflow-wrap:anywhere;padding:9px 13px;border:1px solid #b7c6d5;border-radius:7px;background:#f7fafc;color:#17334d;cursor:pointer}.btn[aria-pressed=true]{background:#145a7a;color:white;border-color:#145a7a}.btn:hover{box-shadow:0 0 0 2px #b4d8e6}.btn:focus-visible{outline:3px solid #e99a2d;outline-offset:3px}.card{padding:18px;background:#f5f8fa;border:1px solid #d7e0e8;border-radius:8px}.text-small{font-size:14px}.tabular-nums{font-variant-numeric:tabular-nums}[data-formula]{white-space:pre-wrap;font:15px/1.8 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}code{white-space:pre-wrap}a{color:#145a7a}button{touch-action:manipulation}@media(max-width:600px){body{padding:12px}.branches,.channels{gap:8px!important}.btn{padding:8px;font-size:14px}}body{max-width:880px;margin:auto}</style></head><body><nav><a href="index.html#step-4">← 返回教程</a> · <a href="article.md">Markdown</a></nav><p>保留加权求和 z，在预测前插入 SiLU(z)。</p><div id="silu-add-four">

<h2>4/16 · 加入 SiLU 激活</h2>
<div class="flow" aria-label="完整训练流程，点击各步查看计算">
<button class="btn" data-step="0" aria-pressed="false">① 输入 x₁、x₂ 与目标 y</button>

<h3 data-label>③ 新增 SiLU → 预测 ŷ</h3>
<div class="tabular-nums" data-formula>ŷ = SiLU(z) = z × σ(z)
σ(z) = 1 / (1 + e⁻ᶻ)
z = 5 → ŷ ≈ 4.9665</div>
<p data-detail>第三步直接令 ŷ = z；这一步在同一个 z 后面加上 SiLU。</p>

</div>
<noscript>请阅读 Markdown 版本查看全部公式与解释。</noscript><script>const nodes=[{"label":"① 输入 x₁、x₂ 与目标 y","formula":"x₁ = 2，x₂ = 1，目标 y = 6\n初始 w₁ = 2，w₂ = 1，b = 0\n学习率 η = 1/16","detail":"沿用第三步的样本、参数和学习率。"},{"label":"② 加权求和 + bias → z","formula":"z = w₁x₁ + w₂x₂ + b\n  = 2×2 + 1×1 + 0 = 5","detail":"z 仍是加权求和的结果；w₁、w₂、b 仍是要训练的参数。"},{"label":"③ 新增 SiLU → 预测 ŷ","formula":"ŷ = SiLU(z) = z × σ(z)\nσ(z) = 1 / (1 + e⁻ᶻ)\nz = 5 → ŷ ≈ 4.9665","detail":"第三步直接令 ŷ = z；这一步在同一个 z 后面加上 SiLU。"},{"label":"④ 与目标比较 → 损失 L","formula":"L = (ŷ − y)²\n  = (4.9665 − 6)² ≈ 1.0680","detail":"损失函数沿用前面的平方误差；使用经过 SiLU 后的预测。"},{"label":"⑤ 反向传播 → 三个参数的梯度","formula":"∂L/∂ŷ = 2(ŷ − 6) ≈ -2.0669\n∂ŷ/∂z = σ(z) + zσ(z)(1−σ(z)) ≈ 1.0265\n∂L/∂z = (∂L/∂ŷ)(∂ŷ/∂z) ≈ -2.1218\n∂L/∂w₁ = (∂L/∂z)×x₁ ≈ -4.2436\n∂L/∂w₂ = (∂L/∂z)×x₂ ≈ -2.1218\n∂L/∂b = ∂L/∂z ≈ -2.1218","detail":"沿着 L → ŷ → z → w₁、w₂、b 反向计算。新增的 SiLU 导数乘在原来的梯度链上。"},{"label":"⑥ 更新 w₁、w₂、b","formula":"参数新值 = 参数旧值 − η × 对应梯度\nη = 1/16\nw₁ → 2.2652\nw₂ → 1.1326\nb → 0.1326","detail":"三个参数使用本轮算出的梯度同时更新；z 是中间结果，不是独立优化的参数。"},{"label":"⑦ 返回② → 再次预测与计算损失","formula":"新 z = 2w₁ + w₂ + b ≈ 5.7957\n新 ŷ = SiLU(新 z) ≈ 5.7781\n新 L = (新 ŷ − 6)² ≈ 0.0492\n损失：1.0680 → 0.0492","detail":"返回加权求和，重复同一条流程。此处展示一次梯度下降更新。"}];const bs=[...document.querySelectorAll('button')];function select(i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('[data-label]').textContent=nodes[i].label;document.querySelector('[data-formula]').textContent=nodes[i].formula;document.querySelector('[data-detail]').textContent=nodes[i].detail;}bs.forEach((b,i)=>b.addEventListener('click',()=>select(i)));select(0);new ResizeObserver(()=>parent.postMessage({type:"flow-height",height:document.documentElement.scrollHeight},"*")).observe(document.body);</script></body></html>
