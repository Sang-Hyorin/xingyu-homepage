<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8/16 写成矩阵运算</title><style>:root{--font-size-base:16px;--muted-foreground:#536274;--foreground:#162b40;--border:#d7e0e8;--background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px;color:var(--foreground);background:white;font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}h1,h2,h3{line-height:1.35}h2,h3{font-weight:600}.btn{font:inherit;max-width:100%;white-space:normal;overflow-wrap:anywhere;padding:9px 13px;border:1px solid #b7c6d5;border-radius:7px;background:#f7fafc;color:#17334d;cursor:pointer}.btn[aria-pressed=true]{background:#145a7a;color:white;border-color:#145a7a}.btn:hover{box-shadow:0 0 0 2px #b4d8e6}.btn:focus-visible{outline:3px solid #e99a2d;outline-offset:3px}.card{padding:18px;background:#f5f8fa;border:1px solid #d7e0e8;border-radius:8px}.text-small{font-size:14px}.tabular-nums{font-variant-numeric:tabular-nums}[data-formula]{white-space:pre-wrap;font:15px/1.8 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}code{white-space:pre-wrap}a{color:#145a7a}button{touch-action:manipulation}@media(max-width:600px){body{padding:12px}.branches,.channels{gap:8px!important}.btn{padding:8px;font-size:14px}}body{max-width:880px;margin:auto}</style></head><body><nav><a href="index.html#step-8">← 返回教程</a> · <a href="article.md">Markdown</a></nav><p>不增加参数，把重复的逐通道计算组织成矩阵运算。</p><div id="matrices-eight">
<style>
#matrices-eight .flow,#matrices-eight .channel{display:flex;flex-direction:column;align-items:center;gap:calc(var(--font-size-base)*.4)}
#matrices-eight .channels{display:grid;grid-template-columns:1fr 1fr;gap:var(--font-size-base);width:100%}

<h2>8/16 · 写成矩阵运算</h2>
<div class="flow" aria-label="两个并行特征通道的完整训练流程，点击查看计算">
<button class="btn" data-step="0" aria-pressed="true">输入向量 x = [2, 1]ᵀ；目标 y = 6</button>
<span class="arrow">↙ 并行计算 ↘</span>
<div class="channels">
<div class="channel">
<span>门控支路：一起算 z₁、z₂</span>
<button class="btn" data-step="1" aria-pressed="false">矩阵加权求和 → z = Wx + b</button>
<span class="arrow">↓</span>
<button class="btn" data-step="2" aria-pressed="false">逐元素计算 SiLU(z)</button>
</div>
<div class="channel">
<span>另一支路：一起算 u₁、u₂</span>
<button class="btn" data-step="3" aria-pressed="false">矩阵加权求和 → u = Ax + c</button>
<span class="arrow">↓</span>
<span>u = [u₁, u₂]ᵀ</span>
</div>
</div>
<span class="arrow">↘ 汇合 ↙</span>
<button class="btn" data-step="4" aria-pressed="false">逐元素相乘 → h = SiLU(z) ⊙ u</button>
<span class="arrow">↓</span>
<button class="btn" data-step="5" aria-pressed="false">输出加权求和 → ŷ = vᵀh</button>
<span class="arrow">↓</span>
<button class="btn" data-step="6" aria-pressed="false">与目标比较 → 损失 L</button>
<span class="arrow">↓</span>
<button class="btn" data-step="7" aria-pressed="false">反向传播 → 梯度矩阵与向量</button>
<span class="arrow">↓</span>
<button class="btn" data-step="8" aria-pressed="false">更新 W、A、b、c、v：仍然 14 个参数</button>
<span class="arrow">↓</span>
<button class="btn" data-step="9" aria-pressed="false">返回矩阵运算 → 再次预测</button>
</div>
<div class="details" aria-live="polite"><h3 data-label>加权求和 + bias → z₂、u₂</h3><div class="tabular-nums" data-formula>新增通道使用独立的权重。</div><p data-detail>两条通道并行处理同一输入。</p></div>
</div>
<noscript>请阅读 Markdown 版本查看全部公式与解释。</noscript><script>const nodes=[{"label":"输入向量 x = [2, 1]ᵀ；目标 y = 6","formula":"x = [x₁, x₂]ᵀ = [2, 1]ᵀ\n目标 y = 6；η = 1/1024\n\nW = [[2, 1], [−0.5, 0]]\nA = [[0.25, 0.5], [0, 1]]\nb = [0, 0]ᵀ；c = [0, 0]ᵀ\nv = [1, 0.1]ᵀ","detail":"把第七步的数值原样排成矩阵和向量。ᵀ 表示转置，这里把横排的列表写成列向量；W 和 A 每一行对应一个通道。"},{"label":"矩阵加权求和 → z = Wx + b","formula":"z = Wx + b\n\nz₁ = 2×2 + 1×1 + 0 = 5\nz₂ = (−0.5)×2 + 0×1 + 0 = −1\n\nz = [5, −1]ᵀ\n尺寸：(2×2) × (2×1) + (2×1) → (2×1)","detail":"矩阵乘法就是每一行分别与输入做加权求和。它同时写出了原来的 z₁ 和 z₂，没有新增参数。"},{"label":"逐元素计算 SiLU(z)","formula":"SiLU(z) = [SiLU(z₁), SiLU(z₂)]ᵀ\n        ≈ [4.9665, -0.2689]ᵀ\n\n每个元素都使用 SiLU(t) = t/(1 + e⁻ᵗ)","detail":"SiLU 分别作用于向量中的每个数，不会把两个通道混在一起。"},{"label":"矩阵加权求和 → u = Ax + c","formula":"u = Ax + c\n\nu₁ = 0.25×2 + 0.5×1 + 0 = 1\nu₂ = 0×2 + 1×1 + 0 = 1\n\nu = [1, 1]ᵀ","detail":"把第七步另一条支路的两次加权求和也合写成矩阵运算。左右两列现在按支路组织，每列都包含两个通道。"},{"label":"逐元素相乘 → h = SiLU(z) ⊙ u","formula":"h = SiLU(z) ⊙ u\n\nh₁ = SiLU(z₁) × u₁ ≈ 4.9665\nh₂ = SiLU(z₂) × u₂ ≈ -0.2689\n\nh ≈ [4.9665, -0.2689]ᵀ","detail":"⊙ 表示对应位置相乘：第一个乘第一个，第二个乘第二个。这一步没有加法，也不是矩阵乘法。"},{"label":"输出加权求和 → ŷ = vᵀh","formula":"ŷ = vᵀh\n  = v₁h₁ + v₂h₂\n  = 1×4.9665 + 0.1×(-0.2689)\n  ≈ 4.9396\n\n尺寸：(1×2) × (2×1) → 一个数","detail":"这就是上一页的输出加权求和，现在写成向量内积。在这里，两个通道的贡献被合并成最终预测。"},{"label":"与目标比较 → 损失 L","formula":"L = (ŷ − y)²\n  = (4.9396 − 6)² ≈ 1.1244","detail":"仍然只有一个最终预测和一个损失，两个通道一起为降低它而训练。"},{"label":"反向传播 → 梯度矩阵与向量","formula":"δ = ∂L/∂ŷ = 2(ŷ − 6) ≈ -2.1207\n∂L/∂v = δh\n∂L/∂h = δv\n\n∂L/∂z = (δv) ⊙ u ⊙ SiLU′(z)\n        ≈ [-2.1770, -0.0153]ᵀ\n∂L/∂u = (δv) ⊙ SiLU(z)\n        ≈ [-10.5326, 0.0570]ᵀ\n\n∂L/∂W = (∂L/∂z)xᵀ\n≈ [[-4.3540, -2.1770],\n    [-0.0307, -0.0153]]\n∂L/∂A = (∂L/∂u)xᵀ\n≈ [[-21.0652, -10.5326],\n    [0.1141, 0.0570]]\n∂L/∂b = ∂L/∂z；∂L/∂c = ∂L/∂u","detail":"梯度公式与第七步逐项相同。(∂L/∂z)xᵀ 是列向量乘行向量，得到 2×2 的梯度矩阵；每个元素仍然是对应梯度乘对应输入。"},{"label":"更新 W、A、b、c、v：仍然 14 个参数","formula":"每组参数 Θ ← Θ − η(∂L/∂Θ)\nη = 1/1024；Θ 依次取 W、A、b、c、v\n\n新 W ≈ [[2.0043, 1.0021],\n             [-0.5000, 0.0000]]\n新 A ≈ [[0.2706, 0.5103],\n             [-0.0001, 0.9999]]\n新 b ≈ [0.0021, 0.0000]ᵀ\n新 c ≈ [0.0103, -0.0001]ᵀ\n新 v ≈ [1.0103, 0.0994]ᵀ","detail":"W 有 4 个数，A 有 4 个数，b、c、v 各有 2 个数，共 14 个参数。矩阵只是把原来的参数放在一起计算。"},{"label":"返回矩阵运算 → 再次预测","formula":"新 z = 新 W × x + 新 b\n新 u = 新 A × x + 新 c\n新 h = SiLU(新 z) ⊙ 新 u\n新 ŷ = 新 vᵀ × 新 h ≈ 5.3146\n\n损失：1.1244 → 0.4698\n与第七步的结果相同","detail":"矩阵形式便于把大量通道一起交给 GPU 计算。网络仍是原来的网络，本步只改变计算的组织方式。"}];const bs=[...document.querySelectorAll('button')];function select(i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('[data-label]').textContent=nodes[i].label;document.querySelector('[data-formula]').textContent=nodes[i].formula;document.querySelector('[data-detail]').textContent=nodes[i].detail;}bs.forEach((b,i)=>b.addEventListener('click',()=>select(i)));select(0);new ResizeObserver(()=>parent.postMessage({type:"flow-height",height:document.documentElement.scrollHeight},"*")).observe(document.body);</script></body></html>
