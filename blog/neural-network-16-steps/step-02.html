<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2/16 两个输入、两个权重</title><style>:root{--font-size-base:16px;--muted-foreground:#536274;--foreground:#162b40;--border:#d7e0e8;--background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px;color:var(--foreground);background:white;font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}h1,h2,h3{line-height:1.35}h2,h3{font-weight:600}.btn{font:inherit;max-width:100%;white-space:normal;overflow-wrap:anywhere;padding:9px 13px;border:1px solid #b7c6d5;border-radius:7px;background:#f7fafc;color:#17334d;cursor:pointer}.btn[aria-pressed=true]{background:#145a7a;color:white;border-color:#145a7a}.btn:hover{box-shadow:0 0 0 2px #b4d8e6}.btn:focus-visible{outline:3px solid #e99a2d;outline-offset:3px}.card{padding:18px;background:#f5f8fa;border:1px solid #d7e0e8;border-radius:8px}.text-small{font-size:14px}.tabular-nums{font-variant-numeric:tabular-nums}[data-formula]{white-space:pre-wrap;font:15px/1.8 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}code{white-space:pre-wrap}a{color:#145a7a}button{touch-action:manipulation}@media(max-width:600px){body{padding:12px}.branches,.channels{gap:8px!important}.btn{padding:8px;font-size:14px}}body{max-width:880px;margin:auto}</style></head><body><nav><a href="index.html#step-2">← 返回教程</a> · <a href="article.md">Markdown</a></nav><p>增加一个输入和一个权重，仍然预测一个数。</p><section id="two-weight-training">

  <div class="card detail" aria-live="polite" aria-atomic="true">

  <style>#one-weight-training .training-flow,#two-weight-training .flow,#bias-training .flow{display:flex!important;flex-direction:column!important;align-items:center!important;gap:8px!important}.right,.right-arrow{display:none!important}.down,.down-arrow{display:inline!important}</style><noscript>请阅读 Markdown 版本查看全部公式与解释。</noscript><script>const nodes=[{"label":"输入与初始参数","formula":"x₁ = 2，x₂ = 1，目标 y = 6\nw₁ = 2，w₂ = 1；η = 1/16","detail":"沿用相同的输入和目标，新增参数如本页所示。"},{"label":"加权求和","formula":"ŷ = w₁x₁ + w₂x₂ = 2 × 2 + 1 × 1 = 5","detail":"第一个输入贡献 4，第二个输入贡献 1。第三步会在这个加权和上加偏置。"},{"label":"计算损失","formula":"L = (ŷ − y)² = (5 − 6)² = 1","detail":"两个权重共同产生一个预测，所以这条样本只算一次损失。"},{"label":"更新两个权重","formula":"g₁ = 2(5 − 6) × 2 = −4，g₂ = 2(5 − 6) × 1 = −2","detail":"学习率仍为 1/16。两个权重分别用各自的梯度更新，从 2 和 1 变成 2.25 和 1.125。"},{"label":"再次预测","formula":"ŷ = 2.25 × 2 + 1.125 × 1 = 5.625","detail":"参考答案是 6，损失从 1 降到约 0.141。"}];const bs=[...document.querySelectorAll('button')];function select(i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('[data-label]').textContent=nodes[i].label;document.querySelector('[data-formula]').textContent=nodes[i].formula;document.querySelector('[data-detail]').textContent=nodes[i].detail;}bs.forEach((b,i)=>b.addEventListener('click',()=>select(i)));select(0);new ResizeObserver(()=>parent.postMessage({type:"flow-height",height:document.documentElement.scrollHeight},"*")).observe(document.body);</script></body></html>
