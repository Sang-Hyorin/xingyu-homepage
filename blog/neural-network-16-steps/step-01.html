<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1/16 一个权重</title><style>:root{--font-size-base:16px;--muted-foreground:#536274;--foreground:#162b40;--border:#d7e0e8;--background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px;color:var(--foreground);background:white;font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}h1,h2,h3{line-height:1.35}h2,h3{font-weight:600}.btn{font:inherit;max-width:100%;white-space:normal;overflow-wrap:anywhere;padding:9px 13px;border:1px solid #b7c6d5;border-radius:7px;background:#f7fafc;color:#17334d;cursor:pointer}.btn[aria-pressed=true]{background:#145a7a;color:white;border-color:#145a7a}.btn:hover{box-shadow:0 0 0 2px #b4d8e6}.btn:focus-visible{outline:3px solid #e99a2d;outline-offset:3px}.card{padding:18px;background:#f5f8fa;border:1px solid #d7e0e8;border-radius:8px}.text-small{font-size:14px}.tabular-nums{font-variant-numeric:tabular-nums}[data-formula]{white-space:pre-wrap;font:15px/1.8 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}code{white-space:pre-wrap}a{color:#145a7a}button{touch-action:manipulation}@media(max-width:600px){body{padding:12px}.branches,.channels{gap:8px!important}.btn{padding:8px;font-size:14px}}body{max-width:880px;margin:auto}</style></head><body><nav><a href="index.html#step-1">← 返回教程</a> · <a href="article.md">Markdown</a></nav><p>只用一个可训练权重，完整走通预测、损失、求导和更新。</p><section id="one-weight-training">
  <style>
    #one-weight-training h2 { margin-bottom: calc(var(--font-size-base) * .5); }
    #one-weight-training .training-flow {
      display: grid;
      grid-template-columns: max-content auto max-content auto max-content auto max-content auto max-content;
      justify-content: start;
      align-items: center;
      gap: calc(var(--font-size-base) * .4);
    }
    #one-weight-training .training-arrow { color: var(--muted-foreground); text-align: center; }
    #one-weight-training .training-detail {
      display: grid;
      gap: calc(var(--font-size-base) * .35);
      margin-top: var(--font-size-base);
    }
    #one-weight-training [data-formula] { overflow-wrap: anywhere; }
    #one-weight-training .down-arrow { display: none; }
    @media (max-width: 600px) {
      #one-weight-training .training-flow {
        grid-template-columns: minmax(0, 1fr);
        justify-items: stretch;
      }
      #one-weight-training .right-arrow { display: none; }
      #one-weight-training .down-arrow { display: inline; }
    }
  </style>
  <h2>1/16 · 一个权重</h2>
  <div class="training-flow" role="group" aria-label="训练流程，选择节点查看算法">
    <button type="button" class="btn" data-step="0" aria-pressed="false">训练样本</button>
    <span class="training-arrow" aria-hidden="true"><span class="right-arrow">→</span><span class="down-arrow">↓</span></span>
    <button type="button" class="btn" data-step="1" aria-pressed="true">前向预测</button>
    <span class="training-arrow" aria-hidden="true"><span class="right-arrow">→</span><span class="down-arrow">↓</span></span>
    <button type="button" class="btn" data-step="2" aria-pressed="false">计算损失</button>
    <span class="training-arrow" aria-hidden="true"><span class="right-arrow">→</span><span class="down-arrow">↓</span></span>
    <button type="button" class="btn" data-step="3" aria-pressed="false">算梯度并更新</button>
    <span class="training-arrow" aria-hidden="true"><span class="right-arrow">→</span><span class="down-arrow">↓</span></span>
    <button type="button" class="btn" data-step="4" aria-pressed="false">再次预测</button>
  </div>
  <div class="training-detail card" aria-live="polite" aria-atomic="true">
    <h3 data-label>前向预测</h3>
    <div class="tabular-nums"><code data-formula>ŷ = w × x = 2 × 2 = 4</code></div>
    <p data-detail>把输入乘以当前权重，得到预测值 4。</p>
  </div>
  <style>#one-weight-training .training-flow,#two-weight-training .flow,#bias-training .flow{display:flex!important;flex-direction:column!important;align-items:center!important;gap:8px!important}.right,.right-arrow{display:none!important}.down,.down-arrow{display:inline!important}</style><noscript>请阅读 Markdown 版本查看全部公式与解释。</noscript><script>const nodes=[{"label":"训练样本","formula":"x = 2，y = 6，初始 w = 2","detail":"x 是输入，y 是参考答案，w 是训练要调整的权重。"},{"label":"前向预测","formula":"ŷ = w × x = 2 × 2 = 4","detail":"把输入乘以当前权重，得到预测值 4。"},{"label":"计算损失","formula":"L = (ŷ − y)² = (4 − 6)² = 4","detail":"把预测值与参考答案的差平方，得到损失。"},{"label":"算梯度并更新","formula":"梯度 g = 2(wx − y)x = −8；w ← 2 − (1/16) × (−8) = 2.5","detail":"梯度为负，沿梯度反方向更新就会增大 w。本例学习率取 1/16。"},{"label":"再次预测","formula":"ŷ = 2.5 × 2 = 5；L = (5 − 6)² = 1","detail":"用更新后的权重再算一次，损失从 4 降到 1。下一轮可以重复这个过程。"}];const bs=[...document.querySelectorAll('button')];function select(i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('[data-label]').textContent=nodes[i].label;document.querySelector('[data-formula]').textContent=nodes[i].formula;document.querySelector('[data-detail]').textContent=nodes[i].detail;}bs.forEach((b,i)=>b.addEventListener('click',()=>select(i)));select(0);new ResizeObserver(()=>parent.postMessage({type:"flow-height",height:document.documentElement.scrollHeight},"*")).observe(document.body);</script></body></html>
