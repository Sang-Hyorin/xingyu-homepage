<h2>5/16 · 增加门控支路</h2>
<div class="flow" aria-label="含两条分支的完整训练流程，点击节点查看算法">
<button class="btn" data-step="0" aria-pressed="false">输入 x₁、x₂；目标 y</button>

<div class="branch">

<noscript>请阅读 Markdown 版本查看全部公式与解释。</noscript><script>const nodes=[{"label":"输入 x₁、x₂；目标 y","formula":"x₁ = 2，x₂ = 1，目标 y = 6\n原分支：w₁ = 2，w₂ = 1，b = 0\n新分支：a₁ = 0.25，a₂ = 0.5，c = 0","detail":"同一组输入送入两条支路。原分支沿用上一步的初始参数。"},{"label":"加权求和 + bias → z","formula":"z = w₁x₁ + w₂x₂ + b\n  = 2×2 + 1×1 + 0 = 5","detail":"保留原来的 z、权重和 bias。"},{"label":"SiLU(z)","formula":"SiLU(z) = z × σ(z)\nσ(z) = 1/(1 + e⁻ᶻ)\nSiLU(5) ≈ 4.9665","detail":"保留第四步的 SiLU；它的输出现在用于调节另一条支路。"},{"label":"新的加权求和 → u","formula":"u = a₁x₁ + a₂x₂ + c\n  = 0.25×2 + 0.5×1 + 0 = 1","detail":"u 是新分支的输出，不是梯度。a₁、a₂、c 是新增的可训练参数，算法仍是你已学过的加权求和。"},{"label":"相乘 → ŷ = SiLU(z) × u","formula":"ŷ = SiLU(z) × u\n  ≈ 4.9665 × 1 = 4.9665","detail":"新增的核心运算只有相乘。初始 u = 1，所以初始预测和第四步相同；SiLU 门控值并不局限于 0～1。"},{"label":"与 y 比较 → 损失 L","formula":"L = (ŷ − y)²\n  = (4.9665 − 6)² ≈ 1.0680","detail":"保留原来的平方误差。"},{"label":"反向传播 → 两条分支的梯度","formula":"∂L/∂ŷ = 2(ŷ − 6) ≈ -2.0669\n\n原分支：\n∂L/∂z = (∂L/∂ŷ) × u × SiLU′(z) ≈ -2.1218\n(∂L/∂w₁, ∂L/∂w₂, ∂L/∂b)\n= (2∂L/∂z, ∂L/∂z, ∂L/∂z)\n\n新分支：\n∂L/∂u = (∂L/∂ŷ) × SiLU(z) ≈ -10.2655\n(∂L/∂a₁, ∂L/∂a₂, ∂L/∂c)\n= (2∂L/∂u, ∂L/∂u, ∂L/∂u)","detail":"乘法处把梯度分到两条支路：对其中一个乘数求导，就乘以另一个乘数。"},{"label":"更新两组权重与 bias","formula":"参数新值 = 参数旧值 − η × 对应梯度\n本例 η = 1/1024\n(w₁, w₂, b) → (2.0041, 1.0021, 0.0021)\n(a₁, a₂, c) → (0.2700, 0.5100, 0.0100)","detail":"六个参数同时更新。新增支路的梯度较大，本例将学习率从 1/16 调小到 1/1024，避免一次更新跨得太远。"},{"label":"返回两条支路 → 再次预测","formula":"新 z ≈ 5.0124，新 u ≈ 1.0601\n新 ŷ = SiLU(新 z) × 新 u ≈ 5.2788\n损失：1.0680 → 0.5201","detail":"两条支路重新计算，再相乘、算损失、反向传播，重复训练。"}];const bs=[...document.querySelectorAll('button')];function select(i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('[data-label]').textContent=nodes[i].label;document.querySelector('[data-formula]').textContent=nodes[i].formula;document.querySelector('[data-detail]').textContent=nodes[i].detail;}bs.forEach((b,i)=>b.addEventListener('click',()=>select(i)));select(0);new ResizeObserver(()=>parent.postMessage({type:"flow-height",height:document.documentElement.scrollHeight},"*")).observe(document.body);</script></body></html>
