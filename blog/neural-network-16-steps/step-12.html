<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12/16 AdamW：权重衰减</title><style>:root{--font-size-base:16px;--muted-foreground:#536274;--foreground:#162b40;--border:#d7e0e8;--background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px;color:var(--foreground);background:white;font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}h1,h2,h3{line-height:1.35}h2,h3{font-weight:600}.btn{font:inherit;max-width:100%;white-space:normal;overflow-wrap:anywhere;padding:9px 13px;border:1px solid #b7c6d5;border-radius:7px;background:#f7fafc;color:#17334d;cursor:pointer}.btn[aria-pressed=true]{background:#145a7a;color:white;border-color:#145a7a}.btn:hover{box-shadow:0 0 0 2px #b4d8e6}.btn:focus-visible{outline:3px solid #e99a2d;outline-offset:3px}.card{padding:18px;background:#f5f8fa;border:1px solid #d7e0e8;border-radius:8px}.text-small{font-size:14px}.tabular-nums{font-variant-numeric:tabular-nums}[data-formula]{white-space:pre-wrap;font:15px/1.8 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}code{white-space:pre-wrap}a{color:#145a7a}button{touch-action:manipulation}@media(max-width:600px){body{padding:12px}.branches,.channels{gap:8px!important}.btn{padding:8px;font-size:14px}}body{max-width:880px;margin:auto}</style></head><body><nav><a href="index.html#step-12">← 返回教程</a> · <a href="article.md">Markdown</a></nav><p>在 Adam 更新中单独加入向零收缩的权重衰减项。</p><div id="adamw-twelve">

<div class="details" aria-live="polite"><h3 data-label>新增第二个样本 → 一个 batch</h3><div class="tabular-nums" data-formula>样本 1：x = [2, 1]ᵀ，y = 6
样本 2：x = [1, 2]ᵀ，y = 4</div><p data-detail>两个样本使用同一组参数。</p></div>
</div>
<noscript>请阅读 Markdown 版本查看全部公式与解释。</noscript><script>const nodes=[{"label":"保留两个样本 → 一个 batch","formula":"样本 1（保留）：x⁽¹⁾ = [2, 1]ᵀ，y⁽¹⁾ = 6\n样本 2（新增）：x⁽²⁾ = [1, 2]ᵀ，y⁽²⁾ = 4\nbatch size = 2；η = 1/1024\n\nW = [[2, 1], [−0.5, 0]]\nA = [[0.25, 0.5], [0, 1]]\nb = c = [0, 0]ᵀ；v = [1, 0.1]ᵀ","detail":"保留样本、网络和学习率，从相同初值重新演示 AdamW。新增 λ = 0.01，仅对 W、A、v 衰减；本例的 bias b、c 不衰减。这是教学设置，不是已经验证的 Qwen 微调配置。"},{"label":"每个样本：z = Wx + b","formula":"z⁽ᵏ⁾ = Wx⁽ᵏ⁾ + b\n\n样本 1：\nz = [5.0000, -1.0000]ᵀ\n\n样本 2：\nz = [4.0000, -0.5000]ᵀ","detail":"W 和 b 只有一份。每个样本把自己的输入送入相同的加权求和。"},{"label":"逐元素 SiLU(z)","formula":"每个样本分别计算 SiLU(z)\n\n样本 1：\nSiLU(z) = [4.9665, -0.2689]ᵀ\n\n样本 2：\nSiLU(z) = [3.9281, -0.1888]ᵀ","detail":"激活仍然逐元素进行，两个样本之间不会在这里混合。"},{"label":"每个样本：u = Ax + c","formula":"u⁽ᵏ⁾ = Ax⁽ᵏ⁾ + c\n\n样本 1：\nu = [1.0000, 1.0000]ᵀ\n\n样本 2：\nu = [1.2500, 2.0000]ᵀ","detail":"另一条支路也保持不变；两个样本共用 A 和 c。"},{"label":"每个样本：h = SiLU(z) ⊙ u","formula":"h⁽ᵏ⁾ = SiLU(z⁽ᵏ⁾) ⊙ u⁽ᵏ⁾\n\n样本 1：\nh = [4.9665, -0.2689]ᵀ\n\n样本 2：\nh = [4.9101, -0.3775]ᵀ","detail":"每个样本内部的对应通道相乘，仍然保留两个特征通道。"},{"label":"每个样本：ŷ = vᵀh","formula":"ŷ⁽ᵏ⁾ = vᵀh⁽ᵏ⁾\n\n样本 1：\n预测 ŷ = 4.9396；目标 y = 6\n\n样本 2：\n预测 ŷ = 4.8723；目标 y = 4","detail":"同一组输出权重 v，为两个样本分别产生一个预测。"},{"label":"两个样本的损失取平均","formula":"L₁ = (ŷ⁽¹⁾ − 6)² ≈ 1.1244\nL₂ = (ŷ⁽²⁾ − 4)² ≈ 0.7609\n\nLbatch = (L₁ + L₂)/2 ≈ 0.9426","detail":"新增的核心步骤：先各自计算误差的平方，再取平均。不能先平均预测误差再平方，否则正负误差可能抵消。"},{"label":"反向传播 → 两个样本的平均梯度","formula":"对任意参数 θ：\n∂Lbatch/∂θ = (∂L₁/∂θ + ∂L₂/∂θ)/2\n\n例如输出权重 v₁：\n∂L₁/∂v₁ = 2(ŷ⁽¹⁾−6)h₁⁽¹⁾ ≈ -10.5326\n∂L₂/∂v₁ = 2(ŷ⁽²⁾−4)h₁⁽²⁾ ≈ 8.5663\n平均梯度 ≈ -0.9832\n\n各样本沿用原来的完整梯度链：\nδ⁽ᵏ⁾ = 2(ŷ⁽ᵏ⁾ − y⁽ᵏ⁾)\n∂Lₖ/∂v = δ⁽ᵏ⁾h⁽ᵏ⁾\n∂Lₖ/∂z = δ⁽ᵏ⁾v ⊙ u⁽ᵏ⁾ ⊙ SiLU′(z⁽ᵏ⁾)\n∂Lₖ/∂u = δ⁽ᵏ⁾v ⊙ SiLU(z⁽ᵏ⁾)\n∂Lₖ/∂W = (∂Lₖ/∂z)(x⁽ᵏ⁾)ᵀ\n∂Lₖ/∂A = (∂Lₖ/∂u)(x⁽ᵏ⁾)ᵀ\n∂Lₖ/∂b = ∂Lₖ/∂z；∂Lₖ/∂c = ∂Lₖ/∂u","detail":"仍然对 batch 的平均平方误差求梯度。AdamW 的权重衰减不会加进这里的梯度，也不会直接加进 m、s；之后权重变化会间接影响下一轮梯度。"},{"label":"保留 Adam：m、s 与起步偏差校正","formula":"沿用 Adam，对每个参数分别计算：\ngₜ = 本轮平均损失的梯度\nmₜ = 0.9mₜ₋₁ + 0.1gₜ\nsₜ = 0.999sₜ₋₁ + 0.001gₜ²\n\nm̂ₜ = mₜ/(1 − 0.9ᵗ)\nŝₜ = sₜ/(1 − 0.999ᵗ)\nAdam 更新方向 = m̂ₜ/(√ŝₜ + ε)\nε = 10⁻⁸\n\n第 1 轮，输出权重 v₁：\ng₁ ≈ -0.9832\nm̂₁ ≈ -0.9832\nŝ₁ ≈ 0.9666","detail":"这部分与第十一页完全相同。新增的权重衰减在下一节点单独作用，不经过梯度大小的缩放。"},{"label":"新增：Adam 更新 + 权重向零收缩","formula":"原来 Adam：\nθ新 = θ旧 − η × m̂ₜ/(√ŝₜ + ε)\n\n现在 AdamW：\nθ新 = θ旧 − η × m̂ₜ/(√ŝₜ + ε) − ηλθ旧\n      = (1 − ηλ)θ旧 − Adam 更新量\n\nη = 1/1024；本例 λ = 0.01\n仅收缩这一项的系数：1 − ηλ ≈ 0.9999902344\n\n第 1 轮，以 v₁ = 1 为例：\nAdam 部分将它增加约 0.0009765625\n衰减部分将它减少 0.0000097656\n最终 v₁ ≈ 1.0009667969\n\n本例：W、A、v 衰减；b、c 不衰减","detail":"衰减项让正权重变小、负权重变得没那么负，都是向零靠近。总更新仍由两项共同决定，所以 v₁ 最终依然增大。λ 是人为设置的超参数，不是学出来的权重。"},{"label":"重复完整流程 → 再次预测","formula":"同一个 batch 连续更新两轮：\n平均损失 0.942647 → 0.929028 → 0.915593\n\n第 2 轮，v₁ 的 Adam 方向：\nm̂₂/(√ŝ₂ + ε) ≈ -0.9976\n衰减量 ηλv₁ ≈ 0.0000097751\n更新后 v₁ ≈ 1.0019312562","detail":"权重衰减是正则化手段，用来约束权重规模，可能帮助泛化；效果需要看验证集。这个两样本例子只能演示怎么算，不能证明泛化改善。"}];const bs=[...document.querySelectorAll('button')];function select(i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('[data-label]').textContent=nodes[i].label;document.querySelector('[data-formula]').textContent=nodes[i].formula;document.querySelector('[data-detail]').textContent=nodes[i].detail;}bs.forEach((b,i)=>b.addEventListener('click',()=>select(i)));select(0);new ResizeObserver(()=>parent.postMessage({type:"flow-height",height:document.documentElement.scrollHeight},"*")).observe(document.body);</script></body></html>
