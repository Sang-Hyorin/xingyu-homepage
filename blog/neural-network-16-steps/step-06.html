<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6/16 加入输出权重</title><style>:root{--font-size-base:16px;--muted-foreground:#536274;--foreground:#162b40;--border:#d7e0e8;--background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px;color:var(--foreground);background:white;font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}h1,h2,h3{line-height:1.35}h2,h3{font-weight:600}.btn{font:inherit;max-width:100%;white-space:normal;overflow-wrap:anywhere;padding:9px 13px;border:1px solid #b7c6d5;border-radius:7px;background:#f7fafc;color:#17334d;cursor:pointer}.btn[aria-pressed=true]{background:#145a7a;color:white;border-color:#145a7a}.btn:hover{box-shadow:0 0 0 2px #b4d8e6}.btn:focus-visible{outline:3px solid #e99a2d;outline-offset:3px}.card{padding:18px;background:#f5f8fa;border:1px solid #d7e0e8;border-radius:8px}.text-small{font-size:14px}.tabular-nums{font-variant-numeric:tabular-nums}[data-formula]{white-space:pre-wrap;font:15px/1.8 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}code{white-space:pre-wrap}a{color:#145a7a}button{touch-action:manipulation}@media(max-width:600px){body{padding:12px}.branches,.channels{gap:8px!important}.btn{padding:8px;font-size:14px}}body{max-width:880px;margin:auto}</style></head><body><nav><a href="index.html#step-6">← 返回教程</a> · <a href="article.md">Markdown</a></nav><p>把上一页的乘积命名为中间特征 h，新增输出权重 v。</p><div id="output-six">

<h2>6/16 · 加入输出权重</h2>
<div class="flow" aria-label="完整训练流程，点击节点查看计算">
<button class="btn" data-step="0" aria-pressed="false">输入 x₁、x₂；目标 y</button>
<span class="arrow">↙ 同一输入 ↘</span>
<div class="branches">
<div class="branch">
<button class="btn" data-step="1" aria-pressed="false">加权求和 + bias → z</button>

</div>
<div class="branch">
<button class="btn" data-step="3" aria-pressed="false">加权求和 + bias → u</button>

<div class="details" aria-live="polite"><h3 data-label>新增：输出权重 → ŷ = v × h</h3><div class="tabular-nums" data-formula>初始 v = 1，ŷ = v × h</div><p data-detail>v 是新增的可训练权重。</p></div>
</div>
<noscript>请阅读 Markdown 版本查看全部公式与解释。</noscript><script>const nodes=[{"label":"输入 x₁、x₂；目标 y","formula":"x₁ = 2，x₂ = 1，目标 y = 6\n(w₁, w₂, b) = (2, 1, 0)\n(a₁, a₂, c) = (0.25, 0.5, 0)\n新增 v = 1；学习率 η = 1/1024","detail":"沿用第五步的样本、初始参数和学习率，只新增输出权重 v。"},{"label":"加权求和 + bias → z","formula":"z = w₁x₁ + w₂x₂ + b\n  = 2×2 + 1×1 + 0 = 5","detail":"这一条支路完全保留。z 是计算结果，w₁、w₂、b 是参数。"},{"label":"SiLU(z)","formula":"SiLU(z) = z × σ(z)\nσ(z) = 1/(1 + e⁻ᶻ)\nSiLU(5) ≈ 4.9665","detail":"保留原来的非线性激活。"},{"label":"加权求和 + bias → u","formula":"u = a₁x₁ + a₂x₂ + c\n  = 0.25×2 + 0.5×1 + 0 = 1","detail":"保留第五步的第二条支路；u 不是梯度。"},{"label":"相乘 → h = SiLU(z) × u","formula":"h = SiLU(z) × u\n  ≈ 4.9665 × 1 = 4.9665","detail":"h 就是第五步直接当作预测的那个乘积。现在后面还有一步，所以把这个中间结果命名为 h；没有新增运算。"},{"label":"新增：输出权重 → ŷ = v × h","formula":"ŷ = v × h\n初始 v = 1\nŷ = 1 × 4.9665 = 4.9665","detail":"新增一个可训练的输出权重 v，让模型学习如何缩放这个中间特征。初始 v = 1，所以预测与第五步相同。"},{"label":"与 y 比较 → 损失 L","formula":"L = (ŷ − y)²\n  = (4.9665 − 6)² ≈ 1.0680","detail":"保留平方误差，用最后输出的 ŷ 计算损失。"},{"label":"反向传播 → v 及两条支路的梯度","formula":"∂L/∂ŷ = 2(ŷ − 6) ≈ -2.0669\n\n新增输出层：\n∂L/∂v = (∂L/∂ŷ) × h ≈ -10.2655\n∂L/∂h = (∂L/∂ŷ) × v ≈ -2.0669\n\n继续传到原来的两条支路：\n∂L/∂z = (∂L/∂h) × u × SiLU′(z) ≈ -2.1218\n∂L/∂u = (∂L/∂h) × SiLU(z) ≈ -10.2655\n\n(∂L/∂w₁, ∂L/∂w₂, ∂L/∂b)\n= (2∂L/∂z, ∂L/∂z, ∂L/∂z)\n(∂L/∂a₁, ∂L/∂a₂, ∂L/∂c)\n= (2∂L/∂u, ∂L/∂u, ∂L/∂u)","detail":"保留原来的反向传播，只在最前面增加穿过 v × h 的求导。z、u、h 都是中间结果。"},{"label":"同时更新全部七个参数","formula":"参数新值 = 参数旧值 − η × 对应梯度\nη = 1/1024\nv → 1.0100\n(w₁, w₂, b) → (2.0041, 1.0021, 0.0021)\n(a₁, a₂, c) → (0.2700, 0.5100, 0.0100)","detail":"七个参数使用同一次前向计算得到的梯度，同时更新。"},{"label":"返回两条支路 → 再次预测","formula":"新 z ≈ 5.0124，新 u ≈ 1.0601\n新 h = SiLU(新 z) × 新 u ≈ 5.2788\n新 ŷ = 新 v × 新 h ≈ 5.3317\n损失：1.0680 → 0.4466","detail":"返回两条支路重新计算，再经过相乘、输出权重、损失和反向传播，继续训练。"}];const bs=[...document.querySelectorAll('button')];function select(i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('[data-label]').textContent=nodes[i].label;document.querySelector('[data-formula]').textContent=nodes[i].formula;document.querySelector('[data-detail]').textContent=nodes[i].detail;}bs.forEach((b,i)=>b.addEventListener('click',()=>select(i)));select(0);new ResizeObserver(()=>parent.postMessage({type:"flow-height",height:document.documentElement.scrollHeight},"*")).observe(document.body);</script></body></html>
