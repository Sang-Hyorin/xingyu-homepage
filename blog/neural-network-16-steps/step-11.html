<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11/16 Adam：方向与大小的记忆</title><style>:root{--font-size-base:16px;--muted-foreground:#536274;--foreground:#162b40;--border:#d7e0e8;--background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px;color:var(--foreground);background:white;font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}h1,h2,h3{line-height:1.35}h2,h3{font-weight:600}.btn{font:inherit;max-width:100%;white-space:normal;overflow-wrap:anywhere;padding:9px 13px;border:1px solid #b7c6d5;border-radius:7px;background:#f7fafc;color:#17334d;cursor:pointer}.btn[aria-pressed=true]{background:#145a7a;color:white;border-color:#145a7a}.btn:hover{box-shadow:0 0 0 2px #b4d8e6}.btn:focus-visible{outline:3px solid #e99a2d;outline-offset:3px}.card{padding:18px;background:#f5f8fa;border:1px solid #d7e0e8;border-radius:8px}.text-small{font-size:14px}.tabular-nums{font-variant-numeric:tabular-nums}[data-formula]{white-space:pre-wrap;font:15px/1.8 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}code{white-space:pre-wrap}a{color:#145a7a}button{touch-action:manipulation}@media(max-width:600px){body{padding:12px}.branches,.channels{gap:8px!important}.btn{padding:8px;font-size:14px}}body{max-width:880px;margin:auto}</style></head><body><nav><a href="index.html#step-11">← 返回教程</a> · <a href="article.md">Markdown</a></nav><p>用梯度的一阶与二阶矩调整更新步幅，并校正零初始化偏差。</p><div id="adam-eleven">

<noscript>请阅读 Markdown 版本查看全部公式与解释。</noscript><script>const nodes=[{"label":"保留两个样本 → 一个 batch","formula":"样本 1（保留）：x⁽¹⁾ = [2, 1]ᵀ，y⁽¹⁾ = 6\n样本 2（新增）：x⁽²⁾ = [1, 2]ᵀ，y⁽²⁾ = 4\nbatch size = 2；η = 1/1024\n\nW = [[2, 1], [−0.5, 0]]\nA = [[0.25, 0.5], [0, 1]]\nb = c = [0, 0]ᵀ；v = [1, 0.1]ᵀ","detail":"样本、网络、初始参数与前面相同。从初始参数重新演示 Adam，所有 m、s 从 0 开始。学习率仍为 1/1024，便于教学；实际换优化器通常需要重新调学习率。"},{"label":"每个样本：z = Wx + b","formula":"z⁽ᵏ⁾ = Wx⁽ᵏ⁾ + b\n\n样本 1：\nz = [5.0000, -1.0000]ᵀ\n\n样本 2：\nz = [4.0000, -0.5000]ᵀ","detail":"W 和 b 只有一份。每个样本把自己的输入送入相同的加权求和。"},{"label":"逐元素 SiLU(z)","formula":"每个样本分别计算 SiLU(z)\n\n样本 1：\nSiLU(z) = [4.9665, -0.2689]ᵀ\n\n样本 2：\nSiLU(z) = [3.9281, -0.1888]ᵀ","detail":"激活仍然逐元素进行，两个样本之间不会在这里混合。"},{"label":"每个样本：u = Ax + c","formula":"u⁽ᵏ⁾ = Ax⁽ᵏ⁾ + c\n\n样本 1：\nu = [1.0000, 1.0000]ᵀ\n\n样本 2：\nu = [1.2500, 2.0000]ᵀ","detail":"另一条支路也保持不变；两个样本共用 A 和 c。"},{"label":"每个样本：h = SiLU(z) ⊙ u","formula":"h⁽ᵏ⁾ = SiLU(z⁽ᵏ⁾) ⊙ u⁽ᵏ⁾\n\n样本 1：\nh = [4.9665, -0.2689]ᵀ\n\n样本 2：\nh = [4.9101, -0.3775]ᵀ","detail":"每个样本内部的对应通道相乘，仍然保留两个特征通道。"},{"label":"每个样本：ŷ = vᵀh","formula":"ŷ⁽ᵏ⁾ = vᵀh⁽ᵏ⁾\n\n样本 1：\n预测 ŷ = 4.9396；目标 y = 6\n\n样本 2：\n预测 ŷ = 4.8723；目标 y = 4","detail":"同一组输出权重 v，为两个样本分别产生一个预测。"},{"label":"两个样本的损失取平均","formula":"L₁ = (ŷ⁽¹⁾ − 6)² ≈ 1.1244\nL₂ = (ŷ⁽²⁾ − 4)² ≈ 0.7609\n\nLbatch = (L₁ + L₂)/2 ≈ 0.9426","detail":"新增的核心步骤：先各自计算误差的平方，再取平均。不能先平均预测误差再平方，否则正负误差可能抵消。"},{"label":"反向传播 → 两个样本的平均梯度","formula":"对任意参数 θ：\n∂Lbatch/∂θ = (∂L₁/∂θ + ∂L₂/∂θ)/2\n\n例如输出权重 v₁：\n∂L₁/∂v₁ = 2(ŷ⁽¹⁾−6)h₁⁽¹⁾ ≈ -10.5326\n∂L₂/∂v₁ = 2(ŷ⁽²⁾−4)h₁⁽²⁾ ≈ 8.5663\n平均梯度 ≈ -0.9832\n\n各样本沿用原来的完整梯度链：\nδ⁽ᵏ⁾ = 2(ŷ⁽ᵏ⁾ − y⁽ᵏ⁾)\n∂Lₖ/∂v = δ⁽ᵏ⁾h⁽ᵏ⁾\n∂Lₖ/∂z = δ⁽ᵏ⁾v ⊙ u⁽ᵏ⁾ ⊙ SiLU′(z⁽ᵏ⁾)\n∂Lₖ/∂u = δ⁽ᵏ⁾v ⊙ SiLU(z⁽ᵏ⁾)\n∂Lₖ/∂W = (∂Lₖ/∂z)(x⁽ᵏ⁾)ᵀ\n∂Lₖ/∂A = (∂Lₖ/∂u)(x⁽ᵏ⁾)ᵀ\n∂Lₖ/∂b = ∂Lₖ/∂z；∂Lₖ/∂c = ∂Lₖ/∂u","detail":"损失和反向传播都保持不变。g 是这一轮的平均梯度，Adam 只改变算出 g 之后的参数更新规则。"},{"label":"Adam：方向记忆 m + 大小记忆 s","formula":"上一页的 SGD momentum：\nmₜ = 0.9mₜ₋₁ + gₜ\n\nAdam 的方向记忆改为指数加权平均：\nmₜ = 0.9mₜ₋₁ + 0.1gₜ\n\n新增：梯度平方的指数加权平均\nsₜ = 0.999sₜ₋₁ + 0.001gₜ²\n\n以输出权重 v₁ 为例，第 1 轮：\ng₁ ≈ -0.9832\nm₀ = s₀ = 0\nm₁ = 0.1g₁ ≈ -0.0983182\ns₁ = 0.001g₁² ≈ 0.000966646","detail":"m 保留正负方向，s 记录平方后的大小。此处用 s 表示二阶矩，避免与网络输出权重 v 混淆。0.9、0.999 是本例设置，不是新学出来的权重。"},{"label":"校正起步偏差 → 调整步幅 → 更新参数","formula":"① 校正从 0 起步的偏小：\nm̂ₜ = mₜ / (1 − 0.9ᵗ)\nŝₜ = sₜ / (1 − 0.999ᵗ)\nt 表示第几次参数更新\n\n② 用大小记忆调整步幅：\nθ新 = θ旧 − η × m̂ₜ/(√ŝₜ + ε)\nη = 1/1024；ε = 10⁻⁸\n\n第 1 轮，输出权重 v₁：\nm̂₁ = g₁ ≈ -0.9832\nŝ₁ = g₁² ≈ 0.9666\nv₁新 = 1 − η × g₁/(|g₁| + ε)\n      ≈ 1.00098\n\n另一个参数 w₁₁：\n当前梯度 ≈ -1.0292\nw₁₁新 ≈ 2.00098","detail":"第一轮校正后，m̂ 恰好等于当前梯度，ŝ 恰好等于它的平方；非零梯度的更新幅度通常接近 η。后续使用历史统计，各参数的幅度可以不同。ε 防止除零；校正不是修改 bias 参数。"},{"label":"重复完整流程 → 再次预测","formula":"同一个 batch 连续更新两轮：\n平均损失 0.9426 → 0.9290 → 0.9155\n\n第 2 轮，输出权重 v₁：\ng₂ ≈ -0.9163\nm₂ = 0.9m₁ + 0.1g₂ ≈ -0.180121\ns₂ = 0.999s₁ + 0.001g₂² ≈ 0.00180537\n校正后 m̂₂/(√ŝ₂ + ε) ≈ -0.9975\nv₁ → 1.00195","detail":"前向计算、平均损失、求梯度全部保留；每次只把新梯度送入 Adam，再更新同一组 14 个参数。每个参数额外保存 m 和 s，但模型的可训练参数数量没有增加。"}];const bs=[...document.querySelectorAll('button')];function select(i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('[data-label]').textContent=nodes[i].label;document.querySelector('[data-formula]').textContent=nodes[i].formula;document.querySelector('[data-detail]').textContent=nodes[i].detail;}bs.forEach((b,i)=>b.addEventListener('click',()=>select(i)));select(0);new ResizeObserver(()=>parent.postMessage({type:"flow-height",height:document.documentElement.scrollHeight},"*")).observe(document.body);</script></body></html>
