<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3/16 加入偏置 bias</title><style>:root{--font-size-base:16px;--muted-foreground:#536274;--foreground:#162b40;--border:#d7e0e8;--background:#fff}*{box-sizing:border-box}body{margin:0;padding:24px;color:var(--foreground);background:white;font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}h1,h2,h3{line-height:1.35}h2,h3{font-weight:600}.btn{font:inherit;max-width:100%;white-space:normal;overflow-wrap:anywhere;padding:9px 13px;border:1px solid #b7c6d5;border-radius:7px;background:#f7fafc;color:#17334d;cursor:pointer}.btn[aria-pressed=true]{background:#145a7a;color:white;border-color:#145a7a}.btn:hover{box-shadow:0 0 0 2px #b4d8e6}.btn:focus-visible{outline:3px solid #e99a2d;outline-offset:3px}.card{padding:18px;background:#f5f8fa;border:1px solid #d7e0e8;border-radius:8px}.text-small{font-size:14px}.tabular-nums{font-variant-numeric:tabular-nums}[data-formula]{white-space:pre-wrap;font:15px/1.8 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}code{white-space:pre-wrap}a{color:#145a7a}button{touch-action:manipulation}@media(max-width:600px){body{padding:12px}.branches,.channels{gap:8px!important}.btn{padding:8px;font-size:14px}}body{max-width:880px;margin:auto}</style></head><body><nav><a href="index.html#step-3">← 返回教程</a> · <a href="article.md">Markdown</a></nav><p>在加权求和后增加可训练的偏置 b。</p><section id="bias-training">
  <style>
    #bias-training h2 { margin-bottom: calc(var(--font-size-base) * .5); }

  </style>
  <h2>3/16 · 加入偏置 bias</h2>
  <div class="flow" role="group" aria-label="选择节点查看算法">
    <button class="btn" type="button">输入与初始参数</button><span aria-hidden="true">↓</span><button class="btn" type="button" aria-pressed="true">加权求和 + 偏置</button>
    <span class="arrow" aria-hidden="true"><span class="right">→</span><span class="down">↓</span></span>
    <button class="btn" type="button" aria-pressed="false">计算损失</button>
    <span class="arrow" aria-hidden="true"><span class="right">→</span><span class="down">↓</span></span>
    <button class="btn" type="button" aria-pressed="false">更新三个参数</button>
    <span class="arrow" aria-hidden="true"><span class="right">→</span><span class="down">↓</span></span>
    <button class="btn" type="button" aria-pressed="false">再次预测</button>
  </div>
  <div class="card detail" aria-live="polite" aria-atomic="true">
    <h3 data-label>加权求和 + 偏置</h3>
    <code data-formula>ŷ = w₁x₁ + w₂x₂ + b = 2 × 2 + 1 × 1 + 0 = 5</code>
    <p data-detail>偏置 b 直接加到预测上。本例把它初始化为 0。</p>
  </div>
  <style>#one-weight-training .training-flow,#two-weight-training .flow,#bias-training .flow{display:flex!important;flex-direction:column!important;align-items:center!important;gap:8px!important}.right,.right-arrow{display:none!important}.down,.down-arrow{display:inline!important}</style><noscript>请阅读 Markdown 版本查看全部公式与解释。</noscript><script>const nodes=[{"label":"输入与初始参数","formula":"x₁ = 2，x₂ = 1，目标 y = 6\nw₁ = 2，w₂ = 1，b = 0；η = 1/16","detail":"沿用相同的输入和目标，新增参数如本页所示。"},{"label":"加权求和 + 偏置","formula":"z = w₁x₁ + w₂x₂ + b = 2×2 + 1×1 + 0 = 5\n本步直接令 ŷ = z。","detail":"偏置 b 直接加到预测上。本例把它初始化为 0。"},{"label":"计算损失","formula":"L = (ŷ − y)² = (5 − 6)² = 1","detail":"参考答案还是 6。我们继续用平方误差。"},{"label":"更新三个参数","formula":"∂L/∂w₁ = 2(5−6)×2 = −4\n∂L/∂w₂ = 2(5−6)×1 = −2\n∂L/∂b = 2(5−6) = −2\n(w₁, w₂, b) → (2.25, 1.125, 0.125)","detail":"b 每增加 1，预测也增加 1，所以这里乘以 1。两个权重各自用原来的梯度更新为 2.25 和 1.125。"},{"label":"再次预测","formula":"ŷ = 2.25 × 2 + 1.125 × 1 + 0.125 = 5.75","detail":"三个参数同时更新后，平方误差从 1 降到 0.0625。"}];const bs=[...document.querySelectorAll('button')];function select(i){bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('[data-label]').textContent=nodes[i].label;document.querySelector('[data-formula]').textContent=nodes[i].formula;document.querySelector('[data-detail]').textContent=nodes[i].detail;}bs.forEach((b,i)=>b.addEventListener('click',()=>select(i)));select(0);new ResizeObserver(()=>parent.postMessage({type:"flow-height",height:document.documentElement.scrollHeight},"*")).observe(document.body);</script></body></html>
